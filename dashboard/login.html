<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Compliance Hub</title>
  <style>
    :root { --primary: #1d4ed8; --primary-2: #3b82f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 2.5rem 2rem;
      width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    h1 { font-size: 1.4rem; color: #0f172a; margin-bottom: 0.4rem; }
    p.sub { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; color: #475569; margin-bottom: 0.4rem; }
    input[type="password"] {
      width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #cbd5e1; border-radius: 10px;
      font-size: 0.95rem; outline: none;
    }
    input[type="password"]:focus { border-color: var(--primary-2); }
    button {
      width: 100%; margin-top: 1.2rem; padding: 0.75rem; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 0.85rem; margin-top: 0.8rem; min-height: 1.1rem; }
  </style>
</head>
<body>
  <form class="login-card" id="login-form">
    <h1>Compliance & Operations Hub</h1>
    <p class="sub">Enter your access token to continue.</p>
    <label for="token">Access token</label>
    <input type="password" id="token" autocomplete="current-password" autofocus>
    <button type="submit" id="submit">Sign in</button>
    <div class="error" id="error" role="alert"></div>
  </form>

  <script>
    (function () {
      "use strict";
      const form = document.getElementById("login-form");
      const tokenEl = document.getElementById("token");
      const submit = document.getElementById("submit");
      const errorEl = document.getElementById("error");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errorEl.textContent = "";
        submit.disabled = true;
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: tokenEl.value }),
          });
          if (res.ok) {
            window.location.href = "/";
            return;
          }
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || "Sign-in failed.";
        } catch (_) {
          errorEl.textContent = "Could not reach the server.";
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
